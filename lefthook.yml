pre-commit:
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: npx --no-install biome check {staged_files}
    format:
      glob: '*.{js,ts,jsx,tsx,json}'
      run: npx --no-install biome format {staged_files} --write && git add {staged_files}
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx --no-install commitlint --edit
